configuration:
  database:
    name: Nazwa bazy danych
    description: Nazwa własnej bazy danych w aplikacji MariaDB. Nigdy nie używaj "homeassistant".
  initial_admin_password:
    name: Hasło startowe administratora
    description: Hasło konta "admin" przy pierwszym uruchomieniu (co najmniej 10 znaków). Trzeba je zmienić przy pierwszym logowaniu.
  log_level:
    name: Poziom logowania
    description: Ile informacji aplikacja zapisuje w logu.
  mcp_enabled:
    name: Asystenci AI (MCP)
    description: Pozwala asystentom AI, np. Claude, tworzyć projekty faktur przy użyciu osobistego dostępu (Profil → Dostępy dla AI). Łączą się przez bezpośredni port 8099 – włączaj tylko w sieci domowej lub za HTTPS. Tylko projekty – nigdy wystawione, zapłacone ani anulowane faktury.
  public_url:
    name: Adres aplikacji dla linków
    description: Opcjonalnie. Adres, pod którym otwierasz aplikację (np. https://faktury.example.pl/). Asystenci AI linkują do niego projekty.
network:
  8099/tcp: Bezpośredni dostęp bez Home Assistant (opcjonalnie, zwykle pozostaw puste)
