# Home Assistant App (formerly "add-on") definition – AR-11..15.
# Images are published by .github/workflows/release.yml (see docs/ha-release.md).
# GHCR image names are lowercase: ghcr.io/hasisunkid/simpleinvoice-manager-<arch>.
name: SimpleInvoice Manager
version: '0.8.0'
slug: simpleinvoice
description: Rechnungen schreiben, verwalten und als PDF erstellen – für Handwerksbetriebe.
url: https://github.com/hasisunkid/SimpleInvoiceManager
arch:
  - amd64
  - aarch64
# Prebuilt multi-arch images from the release workflow; the Supervisor pulls instead of building.
image: ghcr.io/hasisunkid/simpleinvoice-manager-{arch}

# AR-13: reached through Home Assistant Ingress (sidebar panel), behind the HA login.
# Ingress uses the default port 8099; the image's Docker HEALTHCHECK (/api/health) is the watchdog.
ingress: true
panel_icon: mdi:file-document-edit-outline
panel_title: Rechnungen

# AR-14: optional direct access without Ingress – disabled by default (no host port).
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direkter Zugriff ohne Home Assistant (optional, normalerweise leer lassen)

# AR-12: needs the official MariaDB app; credentials come from the Supervisor services API.
services:
  - mysql:need

options:
  database: simpleinvoice
  initial_admin_password: ''
  log_level: info
  mcp_enabled: false
schema:
  database: match(^[A-Za-z0-9_]{1,64}$)
  initial_admin_password: password?
  log_level: list(trace|debug|info|warn|error|fatal)
  # FR-MCP-12: MCP server for AI assistants (draft invoices only), default off.
  mcp_enabled: bool
  # Address people open the app with – used for links returned to AI assistants (optional).
  public_url: url?
