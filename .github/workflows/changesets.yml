# Release flow with Changesets (AR-20..AR-22, D9, docs/ha-release.md):
#  1. Pushes to main with pending changesets open or update the "Version Packages" pull request
#     (version bump of ha-app, config.yaml, CHANGELOG.md).
#  2. Merging it (no changesets left, new version untagged) creates the tag vX.Y.Z and runs the
#     release workflow: images to GHCR and the GitHub Release.
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Changesets

on:
  push:
    branches: [main]

concurrency:
  group: changesets
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  version:
    name: Version PR or tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Open or update the "Version Packages" pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: 'Version Packages'
          title: 'Version Packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag a new version
        id: tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          tag="v$(node scripts/release.mjs version)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already released"
            exit 0
          fi
          node scripts/release.mjs check --tag "$tag"
          git tag "$tag"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write
      packages: write
