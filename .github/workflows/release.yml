# Publishes a release (AR-10/AR-11, AR-22): Home Assistant App images to GHCR and a GitHub
# Release whose text is the ha-app/CHANGELOG.md entry.
#
# Normally called by changesets.yml after the "Version Packages" pull request was merged and the
# tag vX.Y.Z was created (tags pushed with GITHUB_TOKEN do not trigger workflows, hence
# workflow_call). Pushing a tag by hand still works: git tag v0.8.0 && git push origin v0.8.0
# Images: ghcr.io/<owner>/simpleinvoice-manager-{amd64,aarch64}:<version>
name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Version tag to release, e.g. v0.8.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  images:
    name: Image ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check that the tag matches ha-app (package.json, config.yaml, CHANGELOG.md)
        id: version
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          node scripts/release.mjs check --tag "$TAG"
          echo "version=$(node scripts/release.mjs version)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ha
          platforms: ${{ matrix.platform }}
          push: true
          # AR-26: the same version ends up in the UI, /api/health, config.yaml and the tag.
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/simpleinvoice-manager-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/simpleinvoice-manager-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Create or update the release from the changelog entry (AR-22, AR-23)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node scripts/release.mjs version)
          node scripts/release.mjs notes "$version" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
