# Publishes the Home Assistant App images (AR-10/AR-11) when a version tag is pushed:
#   git tag v0.7.0 && git push origin v0.7.0
# The tag must match `version` in ha-app/config.yaml. Images:
#   ghcr.io/<owner>/simpleinvoice-manager-amd64:<version>
#   ghcr.io/<owner>/simpleinvoice-manager-aarch64:<version>
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Image ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches ha-app/config.yaml
        id: version
        run: |
          # Accepts version: 0.7.0 / "0.7.0" / '0.7.0'
          version=$(sed -nE "s/^version: *['\"]?([^'\"]+)['\"]?[[:space:]]*$/\1/p" ha-app/config.yaml)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match config.yaml version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ha
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/simpleinvoice-manager-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/simpleinvoice-manager-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
